dataset_path: ../../hf_dataset/statements/train # Dataset path or None to load it from HF hub
results: # Files with statement classification results in jsonl format with `id` and `classification` fields.
  - cls: StatementClassificationResultFile
    config:
      name: human_82
      path: ../../data_results/given_statements_human_82.jsonl
      reference_free: true
  - cls: StatementClassificationResultFile
    config:
      name: human_83
      path: ../../data_results/given_statements_human_83.jsonl
      reference_free: true
  - cls: StatementClassificationResultFile
    config:
      name: gpt-5.4
      path: ../../data_results/given_statements/reference_free/openai/gpt-5-4/results.jsonl
      reference_free: true
  - cls: StatementClassificationResultFile
    config:
      name: gpt-5-4-mini
      path: ../../data_results/given_statements/reference_free/openai/gpt-5-4-mini/results.jsonl
      reference_free: true
  - cls: StatementClassificationResultFile
    config:
      name: gemini-3-1-pro-preview
      path: ../../data_results/given_statements/reference_free/google/gemini-3-1-pro-preview/results.jsonl
      reference_free: true
  - cls: StatementClassificationResultFile
    config:
      name: gemini-3-1-flash-lite-preview
      path: ../../data_results/given_statements/reference_free/google/gemini-3-1-flash-lite-preview/results.jsonl
      reference_free: true
  - cls: StatementClassificationResultFile
    config:
      name: llama3_3
      path: ../../data_results/given_statements/reference_free/vllm/llama3_3/results.jsonl
      reference_free: true
  - cls: StatementClassificationResultFile
    config:
      name: gemma_4_31b
      path: ../../data_results/given_statements/reference_free/vllm/gemma_4_31b/results.jsonl
      reference_free: true
  - cls: StatementClassificationResultFile
    config:
      name: gemma_4_31b_reasoning_off_quantized
      path: ../../data_results/given_statements/reference_free/vllm/gemma_4_31b_reasoning_off_quantized/results.jsonl
      reference_free: true
bootstrap_resamples: 10000 # Bootstrap number of bootstrap samples
confidence_level: 0.95 # Confidence level for bootstrap confidence interval
random_seed: # Random seed
